name: QREX
options:
  developmentLanguage: en
  bundleIdPrefix: com.brendigo
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Codesigning is disabled explicitly for simulator CI, not for a release archive.
    # The Apple Developer team and provisioning profile are supplied at signing time.
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.2.4"
    CURRENT_PROJECT_VERSION: "9"
targets:
  QREX:
    type: application
    platform: iOS
    sources:
      - path: QREX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brendigo.qrex
        PRODUCT_NAME: QREX
        INFOPLIST_KEY_CFBundleDisplayName: QREX
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_NSCameraUsageDescription: "Camera access is used only to scan QR codes."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Select a photo to scan a QR code."
        INFOPLIST_KEY_UIApplicationSupportsDocumentBrowser: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
  QREXTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.brendigo.qrex.tests
    sources:
      - path: QREXTests
    dependencies:
      - target: QREX
schemes:
  QREX:
    build:
      targets:
        QREX: all
    test:
      targets:
        - QREXTests
