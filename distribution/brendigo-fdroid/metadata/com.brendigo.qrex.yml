Name: QREX
Summary: Scan and create QR codes offline
Description: |-
  QREX scans and creates QR codes on Android, including camera and gallery scans.
  Create codes for links, text, Wi-Fi and contacts; keep local history and export
  images or saved codes. No account or advertising is required.

  Earlier GitHub QREX v1.0.3 used Google's proprietary ML Kit decoder. Future
  Brendigo-signed builds are planned to use open-source ZXing. This third-party
  repository is NOT the official F-Droid main repository. Existing Play or
  old GitHub APKs may have a different APK signing certificate and cannot
  necessarily update in place.
