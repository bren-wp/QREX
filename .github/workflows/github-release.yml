name: Publish QREX verified GitHub APK + AAB

# Source-driven GitHub-only publisher. Disposable signing identity: never
# suitable for Google Play upload or in-place updates of existing installations.
# Exact main-commit CI, screenshot provenance, certificate equality and
# SHA-256 checksums remain mandatory; published tags are never overwritten.
on:
  workflow_run:
    workflows: ["QREX Android native CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: qrex-github-generic-publisher
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    outputs:
      release_needed: ${{ steps.check.outputs.release_needed }}
      version: ${{ steps.check.outputs.version }}
      code: ${{ steps.check.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "bren-wp/QREX"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$RELEASE_SHA"
          gradle_file=platforms/android/app/build.gradle.kts
          version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' "$gradle_file" | head -1)"
          code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\).*/\1/p' "$gradle_file" | head -1)"
          [[ "$version" =~ ^1\.0\.[0-9]+$ ]]
          [[ "$code" =~ ^[0-9]+$ ]]
          patch="$(printf '%s' "$version" | cut -d. -f3)"
          test "$code" -eq "$((100 + patch))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Already published v$version; skip this exact version without touching assets."
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
          else
            ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1
            latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
            [[ "$latest" =~ ^v1\.0\.[0-9]+$ ]]
            last_patch="$(printf '%s' "$latest" | cut -d. -f3)"
            test "$patch" -gt "$last_patch"
            test -s "docs/releases/v$version.md"
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: preflight
    if: ${{ needs.preflight.outputs.release_needed == 'true' }}
    runs-on: ubuntu-latest
    # Five P03 emulator variants run at max-parallel 2 (up to three 50-minute waves).
    # The publisher must outlive the exact-commit matrix without bypassing it.
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_CODE: ${{ needs.preflight.outputs.code }}
    steps:
      - name: Check out the exact tested Android commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Require current main and no previous v$RELEASE_VERSION release
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "bren-wp/QREX"
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$RELEASE_SHA"
          ! gh release view v$RELEASE_VERSION --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" >/dev/null 2>&1
      - name: Require all 4 green exact-commit Android checks
        shell: bash
        run: |
          set -euo pipefail
          required=(native-platforms.yml capture-screenshots.yml generate-localizations.yml p03-stability.yml)
          # 180-minute bounded wait allows the full five-API P03 matrix to
          # finish under runner contention; real test failures still fail closed.
          for attempt in $(seq 1 540); do
            all_passed=true
            for workflow in "${required[@]}"; do
              result="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&head_sha=$RELEASE_SHA&per_page=30" |
                jq -r --arg sha "$RELEASE_SHA" '[.workflow_runs[] |
                  select(.head_sha == $sha and .event == "push")] |
                  sort_by(.id) | last |
                  if . == null then "missing" else (.status + ":" + (.conclusion // "pending")) end')"
              echo "$workflow: $result"
              if [ "$result" = "completed:failure" ] || [ "$result" = "completed:cancelled" ]; then
                echo "A required workflow did not pass, refusing to publish." >&2
                exit 1
              fi
              if [ "$result" != "completed:success" ]; then all_passed=false; fi
            done
            if [ "$all_passed" = true ]; then exit 0; fi
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$RELEASE_SHA"
            echo "Waiting for all required tests (attempt $attempt/540)"
            sleep 20
          done
          echo "Timed out waiting for successful exact-commit checks." >&2
          exit 1
      - name: Set up Java and Android build tools
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.0'
      - name: Ensure compile SDK 37 and Android build tools 36
        run: |
          set -euo pipefail
          bash tool/install_android_compile_sdk.sh
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ||
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0"
      - name: Build a release-mode APK and AAB without the Play upload key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Android APKs require a cryptographic signature to install.
          # Generate a disposable, one-build certificate; no Play key is needed.
          # This cert is NOT retained: this APK cannot update an installation
          # signed with another certificate, and the AAB is NOT Play-ready.
          keystore="$RUNNER_TEMP/qrex-github-$RELEASE_VERSION.jks"
          trap 'rm -f "$keystore"' EXIT
          password="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -keystore "$keystore" -alias qrex-github \
            -keyalg RSA -keysize 3072 -validity 3650 \
            -storepass "$password" -keypass "$password" \
            -dname "CN=QREX $RELEASE_VERSION GitHub, OU=CI Distribution, O=Brendigo, C=HR" >/dev/null
          export QREX_UPLOAD_STORE_FILE="$keystore"
          export QREX_UPLOAD_STORE_PASSWORD="$password"
          export QREX_UPLOAD_KEY_ALIAS="qrex-github"
          export QREX_UPLOAD_KEY_PASSWORD="$password"
          python3 tool/check_native_release.py
          python3 tool/audit_android_security.py
          python3 tool/generate_localizations.py --check
          # The enabled Android variant registers debug JVM tests; AGP 9 does
          # not register a JVM test task for the release variant in this app.
          # The mandatory CI also runs these tests against the exact commit.
          # Keep release lint, optimized APK and AAB compilation mandatory.
          gradle -p platforms/android --no-daemon --stacktrace \
            :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease
          apk="platforms/android/app/build/outputs/apk/release/app-release.apk"
          aab="platforms/android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$apk"
          test -s "$aab"
          # A disposable self-signed GitHub certificate is not in a public
          # PKI trust store. -strict rejects that expected condition (exit 4).
          # Verify JAR signature integrity and then compare both exact certs.
          jarsigner -verify "$aab" > "$RUNNER_TEMP/qrex-aab-verify.txt"
          grep -F 'jar verified.' "$RUNNER_TEMP/qrex-aab-verify.txt" >/dev/null
          rm -f "$RUNNER_TEMP/qrex-aab-verify.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --min-sdk-version 26 "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$apk" >/dev/null
          cert_aab="$(keytool -printcert -jarfile "$aab" |
            sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 |
            tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          cert_apk="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 |
            tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          [[ "$cert_aab" =~ ^[A-F0-9]{64}$ ]]
          test "$cert_aab" = "$cert_apk"
          test "$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" |
            sed -n "s/^package: name='\([^']*\)' versionCode='\([^']*\)' versionName='\([^']*\)'.*/\1 \2 \3/p" |
            head -n 1)" = "com.brendigo.qrex $RELEASE_CODE $RELEASE_VERSION"
          mkdir -p production
          cp "$apk" production/QREX-Android-$RELEASE_VERSION.apk
          cp "$aab" production/QREX-Android-$RELEASE_VERSION.aab
          (cd production && sha256sum QREX-Android-$RELEASE_VERSION.apk QREX-Android-$RELEASE_VERSION.aab > SHA256SUMS.txt)
      - name: Retrieve twelve real screenshots from exact-SHA emulator CI
        shell: bash
        run: |
          set -euo pipefail
          capture_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/capture-screenshots.yml/runs?branch=main&head_sha=$RELEASE_SHA&per_page=30" |
            jq -r --arg sha "$RELEASE_SHA" '[.workflow_runs[] |
              select(.head_sha == $sha and .event == "push" and .conclusion == "success")] |
              sort_by(.id) | last | .id // empty')"
          [[ "$capture_run" =~ ^[0-9]+$ ]]
          gh run download "$capture_run" --repo "$GITHUB_REPOSITORY" \
            --name qrex-actual-android --dir production
          for screen in splash create scan wifi result history saved more language export about privacy; do
            test -s "production/android-${screen}.png"
          done
          python3 tool/verify_screenshots.py production/android-*.png
          python3 tool/check_dark_screenshots.py production/android-{create,scan,wifi,result,history,saved,more,language,export,about,privacy}.png
          python3 - <<'PY'
          from pathlib import Path
          from tool.verify_screenshots import verify
          screens = sorted(Path("production").glob("android-*.png"))
          assert len(screens) == 12, "Release requires twelve real captures"
          for shot in screens:
              assert verify(shot) == (1080, 1920), f"Not a Play-size screenshot: {shot}"
          PY
          # Retrieve only the unsigned Google Play QA candidate; it is not
          # signed for upload and must not be mistaken for a store-ready AAB.
          play_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/native-platforms.yml/runs?branch=main&head_sha=$RELEASE_SHA&per_page=30" |
            jq -r --arg sha "$RELEASE_SHA" '[.workflow_runs[] |
              select(.head_sha == $sha and .event == "push" and .conclusion == "success")] |
              sort_by(.id) | last | .id // empty')"
          [[ "$play_run" =~ ^[0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/qa-play"
          gh run download "$play_run" --repo "$GITHUB_REPOSITORY" \
            --name QREX-Kotlin-Android-unsigned-AAB-QA --dir "$RUNNER_TEMP/qa-play"
          test -s "$RUNNER_TEMP/qa-play/app-release.aab"
          cp "$RUNNER_TEMP/qa-play/app-release.aab" \
            production/QREX-Android-$RELEASE_VERSION-Play-UNSIGNED-QA.aab
          (cd production && sha256sum QREX-Android-$RELEASE_VERSION*.apk QREX-Android-$RELEASE_VERSION*.aab android-*.png > SHA256SUMS.txt)
          (cd production && sha256sum --check SHA256SUMS.txt)

      - name: Publish stable GitHub version v$RELEASE_VERSION
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$RELEASE_SHA"
          ! gh release view v$RELEASE_VERSION --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" >/dev/null 2>&1
          sed 's/GitHub publication must pass all checks before this version is marked released./Published after passing exact-SHA CI and package verification gates./' \
            "docs/releases/v$RELEASE_VERSION.md" > "$RUNNER_TEMP/qrex-published-release-notes.md"
          gh release create v$RELEASE_VERSION \
            production/QREX-Android-$RELEASE_VERSION.apk \
            production/QREX-Android-$RELEASE_VERSION.aab \
            production/QREX-Android-$RELEASE_VERSION-Play-UNSIGNED-QA.aab \
            production/SHA256SUMS.txt \
            production/android-*.png \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" \
            --title "QREX $RELEASE_VERSION — Android GitHub release" \
            --notes-file "$RUNNER_TEMP/qrex-published-release-notes.md" --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$RELEASE_VERSION" |
            jq -e --arg sha "$RELEASE_SHA" --arg version "$RELEASE_VERSION" '
              .tag_name == ("v" + $version) and .target_commitish == $sha
              and .draft == false and .prerelease == false
              and ([.assets[].name] | sort) ==
                (["QREX-Android-\($version).apk", "QREX-Android-\($version).aab",
                  "QREX-Android-\($version)-Play-UNSIGNED-QA.aab",
                  "SHA256SUMS.txt",
                  "android-splash.png", "android-create.png", "android-scan.png", "android-wifi.png",
                  "android-result.png", "android-history.png", "android-saved.png",
                  "android-more.png", "android-language.png", "android-export.png",
                  "android-about.png", "android-privacy.png"] | sort)
              and all(.assets[]; .size > 0)
            ' >/dev/null

  docs_after_publication:
    name: Synchronize actual published release documents on main
    needs: [preflight, release]
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_CODE: ${{ needs.preflight.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: true
      - name: Advance README and release index after live GitHub asset verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$RELEASE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$RELEASE_VERSION" |
            jq -e --arg sha "$RELEASE_SHA" '.target_commitish == $sha and .draft == false and .prerelease == false and (.assets | length) == 16' >/dev/null
          previous="$(grep -m1 'Latest published release:' README.md | grep -oE 'v1[.]0[.][0-9]+' | head -1 | cut -c2-)"
          [[ "$previous" =~ ^1[.]0[.][0-9]+$ ]]
          python3 tool/sync_published_release.py "$previous" "$RELEASE_VERSION" "$RELEASE_CODE" "$RELEASE_SHA"
          python3 -m unittest discover -s tool -p 'test_*.py'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md RELEASE_NOTES.md docs/releases/INDEX.md "docs/releases/v$RELEASE_VERSION.md"
          git diff --cached --quiet || {
            git commit -m "docs(QREX): verify v$RELEASE_VERSION published assets and screenshots"
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$RELEASE_SHA"
            git push origin HEAD:main
          }
