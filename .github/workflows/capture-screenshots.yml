name: QREX Android screen capture

on:
  pull_request:
    paths:
      # Every tool/ test or gate edit must run CI before merge.
      - "tool/**"
      - "README.md"
      - "RELEASE_NOTES.md"
      - "docs/**"
      - "assets/**"
      - "platforms/**"
      - ".github/workflows/**"
      - "l10n/**"
      - "tool/p03_crash_triage.py"
      - "tool/test_p03_crash_triage.py"
      - "tool/verify_screenshots.py"
      - "tool/check_android_screen.py"
      - "tool/capture_android_screen.sh"
      - "tool/capture_responsive_android.sh"
      - "tool/test_capture_workflow.py"
      - "tool/verify_production_gate.sh"
      - ".github/workflows/production-release.yml"
      - ".github/workflows/capture-screenshots.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "RELEASE_NOTES.md"
      - "docs/**"
      - "assets/**"
      - "platforms/**"
      - "tool/**"
      - "l10n/**"
      - ".github/workflows/capture-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qrex-actual-screens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Actual Android emulator screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.0'
      - name: Enable available KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "KVM available for Android emulator"
          else
            echo "No KVM device; using software emulator rendering"
          fi
      - run: python3 tool/generate_localizations.py --check
      - name: Install Android SDK 37.0
        run: bash tool/install_android_compile_sdk.sh
      - name: Build Android Kotlin APK
        working-directory: platforms/android
        run: gradle --no-daemon :app:assembleDebug
      # Screenshot jobs hit transient corrupt upstream emulator ZIPs too.
      # Reuse P03's bounded, error-classified preflight instead of treating
      # infrastructure download failures as visual regressions.
      - name: Preflight Android Emulator SDK with bounded archive retry
        shell: bash
        run: bash tool/prepare_android_emulator.sh
      - name: Run QREX and capture actual display pixels
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          # software is supported; swiftshader_indirect is deprecated in newer emulators.
          # A software-rendered GitHub runner cannot reliably boot with
          # -camera-back virtualscene: the emulator exits before ADB attaches
          # (TCP 5554 connection refused). Keep the previously verified
          # supported emulator configuration; screenshots must remain actual
          # CameraX/UI captures, never injected or composited marketing art.
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -memory 4096 -cores 2
          # capture_android_screen.sh already runs connectedDebugAndroidTest
          # with hard deadlines; keep ONE shell to avoid duplicate runs.
          script: bash tool/capture_android_screen.sh
      - name: Verify all twelve actual emulator screenshots
        run: |
          test -s docs/screenshots/android-create.png
          for screen in splash create scan wifi result history saved more language export about privacy; do
            test -s "docs/screenshots/android-${screen}.png"
          done
          python3 tool/verify_screenshots.py docs/screenshots/android-*.png
          python3 - <<'PY'
          from pathlib import Path
          from tool.verify_screenshots import verify
          for image in Path("docs/screenshots").glob("android-*.png"):
              assert verify(image) == (1080, 1920), f"Google Play screenshot has invalid dimensions: {image}"
          PY
      - name: Verify compact, reference and large-font device captures
        run: |
          for profile in compact reference; do
            for screen in splash scan create wifi result history saved more language export about privacy terms; do
              test -s "docs/screenshots/responsive/${profile}-${screen}.png"
            done
          done
          for screen in scan create result history saved more language export about privacy terms; do
            test -s "docs/screenshots/responsive/largefont-${screen}.png"
          done
          for screen in create scan more about privacy terms; do
            test -s "docs/screenshots/responsive/light-${screen}.png"
          done
          for profile in tiny tablet; do
            for screen in create result history saved more language export terms; do
              test -s "docs/screenshots/responsive/${profile}-${screen}.png"
            done
          done
          for screen in create result more language export terms; do
            test -s "docs/screenshots/responsive/landscape-${screen}.png"
          done
          for screen in result more language export terms; do
            test -s "docs/screenshots/responsive/xlfont-${screen}.png"
          done
          python3 tool/verify_screenshots.py --responsive docs/screenshots/responsive/*.png
      - name: Measure Splash/Home reference geometry on actual emulator captures
        run: |
          python3 tool/measure_splash_home_geometry.py \
            --actual-dir docs/screenshots \
            --output docs/screenshots/splash-home-measurements.json
          test -s docs/screenshots/splash-home-measurements.json
      - uses: actions/upload-artifact@v7
        with:
          name: qrex-splash-home-measurements
          path: docs/screenshots/splash-home-measurements.json
          if-no-files-found: error
      - name: Audit six real Android screens with verifiable reference limits
        run: |
          python3 tool/measure_six_screen_reference.py \
            --actual-dir docs/screenshots \
            --output docs/screenshots/six-screen-measurements.json
          test -s docs/screenshots/six-screen-measurements.json
      - uses: actions/upload-artifact@v7
        with:
          name: qrex-six-screen-measurements
          path: docs/screenshots/six-screen-measurements.json
          if-no-files-found: error
      - name: Audit every captured QREX screen with documented reference limits
        run: |
          python3 tool/measure_six_screen_reference.py \
            --actual-dir docs/screenshots --all-screens \
            --output docs/screenshots/twelve-screen-measurements.json
          test -s docs/screenshots/twelve-screen-measurements.json
      - uses: actions/upload-artifact@v7
        with:
          name: qrex-twelve-screen-measurements
          path: docs/screenshots/twelve-screen-measurements.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: qrex-responsive-android
          path: docs/screenshots/responsive/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: qrex-actual-android
          path: docs/screenshots/android-*.png
          if-no-files-found: error
