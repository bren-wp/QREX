name: Capture verified QREX screens

on:
  pull_request:
    paths:
      - "platforms/**"
      - ".github/workflows/**"
      - "l10n/**"
      - "tool/verify_screenshots.py"
      - "tool/check_android_screen.py"
      - "tool/capture_android_screen.sh"
      - "tool/test_capture_workflow.py"
      - "tool/verify_production_gate.sh"
      - ".github/workflows/production-release.yml"
      - ".github/workflows/capture-screenshots.yml"
  push:
    branches: [main]
    paths:
      - "platforms/**"
      - "tool/**"
      - "l10n/**"
      - ".github/workflows/capture-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qrex-actual-screens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Actual Android emulator screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable available KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "KVM available for Android emulator"
          else
            echo "No KVM device; using software emulator rendering"
          fi
      - run: python3 tool/generate_localizations.py --check
      - name: Build Android Kotlin APK
        working-directory: platforms/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Run QREX and capture actual display pixels
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          # software is supported; swiftshader_indirect is deprecated in newer emulators.
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -memory 4096 -cores 2
          script: bash tool/capture_android_screen.sh
      - name: Enforce fresh screenshot file
        run: |
          test -s docs/screenshots/android-create.png
          python3 tool/verify_screenshots.py docs/screenshots/android-create.png
      - uses: actions/upload-artifact@v4
        with:
          name: qrex-actual-android
          path: docs/screenshots/android-create.png
          if-no-files-found: error

  ios:
    name: Actual iPhone simulator screenshot
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Prepare app icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          from tool.prepare_platforms import render_png
          p = Path("platforms/ios/QREX/Assets.xcassets/AppIcon.appiconset")
          p.mkdir(parents=True, exist_ok=True)
          render_png(p / "AppIcon.png", 1024)
          (p / "Contents.json").write_text(json.dumps({
            "images": [{"filename":"AppIcon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],
            "info":{"author":"xcode","version":1}
          }), encoding="utf-8")
          PY
      - run: python3 tool/generate_localizations.py --check
      - name: Generate Xcode project
        working-directory: platforms/ios
        run: xcodegen generate --spec project.yml
      - name: Compile standalone SwiftUI app
        working-directory: platforms/ios
        run: |
          xcodebuild -project QREX.xcodeproj -scheme QREX -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Run QREX and capture actual display pixels
        run: |
          DEVICE=$(python3 - <<'PY'
          import json, subprocess
          devices=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","--json"]))["devices"]
          matches=[i["udid"] for v in devices.values() for i in v if i.get("isAvailable") and "iPhone" in i.get("name", "")]
          if not matches: raise SystemExit("No available iPhone simulator")
          print(matches[0])
          PY
          )
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" platforms/ios/build/Build/Products/Debug-iphonesimulator/QREX.app
          xcrun simctl launch "$DEVICE" com.brendigo.qrex -qrex-screenshot-create
          sleep 10
          mkdir -p docs/screenshots
          xcrun simctl io "$DEVICE" screenshot docs/screenshots/ios-create.png
          python3 tool/verify_screenshots.py docs/screenshots/ios-create.png
      - uses: actions/upload-artifact@v4
        with:
          name: qrex-actual-ios
          path: docs/screenshots/ios-create.png
          if-no-files-found: error

