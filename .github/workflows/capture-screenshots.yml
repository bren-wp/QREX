name: Capture verified QREX screens

on:
  push:
    branches: [fix/runtime-screenshots-and-qr-export]
    paths:
      - "platforms/**"
      - "l10n/**"
      - "tool/verify_screenshots.py"
      - "tool/check_android_screen.py"
      - ".github/workflows/capture-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qrex-actual-screens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Actual Android emulator screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: python3 tool/generate_localizations.py --check
      - name: Build Android Kotlin APK
        working-directory: platforms/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Run QREX and capture actual display pixels
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096 -cores 2
          script: |
            set -e
            adb wait-for-device
            # Run device instrumentation first: testing can interrupt QREX and
            # create an unrelated system dialog before screenshot capture.
            gradle -p platforms/android --no-daemon --stacktrace :app:connectedDebugAndroidTest
            adb install -r platforms/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.brendigo.qrex || true
            adb shell input keyevent KEYCODE_HOME
            adb shell am start -n com.brendigo.qrex/.MainActivity --es qrex_screenshot create
            mkdir -p docs/screenshots
            # A valid PNG can depict an ANR or system dialog, so assert that
            # the actual QR creation screen belongs to QREX before capture.
            for attempt in 1 2 3 4; do
              sleep 7
              if adb shell uiautomator dump /sdcard/qrex-window.xml >/dev/null 2>&1 \
                && adb exec-out cat /sdcard/qrex-window.xml > docs/screenshots/android-hierarchy.xml \
                && python3 tool/check_android_screen.py docs/screenshots/android-hierarchy.xml; then
                adb exec-out screencap -p > docs/screenshots/android-create.png
                python3 tool/verify_screenshots.py docs/screenshots/android-create.png
                exit 0
              fi
              echo "QREX foreground check failed, retrying ($attempt/4)"
              adb shell am start -n com.brendigo.qrex/.MainActivity --es qrex_screenshot create || true
            done
            echo "Refusing to publish a System UI ANR or non-QREX screenshot"
            exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: qrex-actual-android
          path: docs/screenshots/android-create.png
          if-no-files-found: error

  ios:
    name: Actual iPhone simulator screenshot
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Prepare app icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          from tool.prepare_platforms import render_png
          p = Path("platforms/ios/QREX/Assets.xcassets/AppIcon.appiconset")
          p.mkdir(parents=True, exist_ok=True)
          render_png(p / "AppIcon.png", 1024)
          (p / "Contents.json").write_text(json.dumps({
            "images": [{"filename":"AppIcon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],
            "info":{"author":"xcode","version":1}
          }), encoding="utf-8")
          PY
      - run: python3 tool/generate_localizations.py --check
      - name: Generate Xcode project
        working-directory: platforms/ios
        run: xcodegen generate --spec project.yml
      - name: Compile standalone SwiftUI app
        working-directory: platforms/ios
        run: |
          xcodebuild -project QREX.xcodeproj -scheme QREX -configuration Release \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Run QREX and capture actual display pixels
        run: |
          DEVICE=$(python3 - <<'PY'
          import json, subprocess
          devices=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","--json"]))["devices"]
          matches=[i["udid"] for v in devices.values() for i in v if i.get("isAvailable") and "iPhone" in i.get("name", "")]
          if not matches: raise SystemExit("No available iPhone simulator")
          print(matches[0])
          PY
          )
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" platforms/ios/build/Build/Products/Release-iphonesimulator/QREX.app
          xcrun simctl launch "$DEVICE" com.brendigo.qrex -qrex-screenshot-create
          sleep 10
          mkdir -p docs/screenshots
          xcrun simctl io "$DEVICE" screenshot docs/screenshots/ios-create.png
          python3 tool/verify_screenshots.py docs/screenshots/ios-create.png
      - uses: actions/upload-artifact@v4
        with:
          name: qrex-actual-ios
          path: docs/screenshots/ios-create.png
          if-no-files-found: error

  publish:
    name: Commit both verified real device screenshots
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-screenshots-and-qr-export
      - uses: actions/download-artifact@v4
        with:
          pattern: qrex-actual-*
          path: docs/screenshots
          merge-multiple: true
      - name: Reject incomplete screenshots
        run: python3 tool/verify_screenshots.py docs/screenshots/android-create.png docs/screenshots/ios-create.png
      - name: Commit without replacing original application assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/android-create.png docs/screenshots/ios-create.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: capture genuine QREX Android and iOS screens [skip ci]"
            git pull --rebase origin fix/runtime-screenshots-and-qr-export
            git push origin HEAD:fix/runtime-screenshots-and-qr-export
          fi
