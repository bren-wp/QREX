name: QREX 1.0.1 — authorized Google Play AAB

# This workflow produces the original-key signed Google Play UPLOAD bundle.
# A GitHub public APK signed with a disposable key is NOT interchangeable.
# Approval and key provisioning require the repository's production environment.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PLAY_UPLOAD_1_0_1 after reviewing the exact main commit'
        required: true
        type: string
      device_qa_confirmed:
        description: 'Physical Android upgrade/migration/camera/export tests completed'
        required: true
        type: boolean
        default: false
      store_review_confirmed:
        description: 'Play Console upload certificate, policy declarations and listing checked'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qrex-play-1-0-1
  cancel-in-progress: false

jobs:
  verify:
    name: Require exact main commit, policy and approved QA
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_APPROVED: ${{ inputs.confirmation }}
      DEVICE_QA_CONFIRMED: ${{ inputs.device_qa_confirmed }}
      STORE_REVIEW_CONFIRMED: ${{ inputs.store_review_confirmed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check 1.0.1 metadata and exact-commit Android quality gates
        run: |
          set -euo pipefail
          bash -n tool/verify_production_gate.sh
          bash -n tool/sign_android_production.sh
          bash tool/verify_production_gate.sh

  play_bundle:
    name: Sign authorized Play upload AAB
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      QREX_UPLOAD_KEYSTORE_BASE64: ${{ secrets.QREX_UPLOAD_KEYSTORE_BASE64 }}
      QREX_UPLOAD_STORE_PASSWORD: ${{ secrets.QREX_UPLOAD_STORE_PASSWORD }}
      QREX_UPLOAD_KEY_ALIAS: ${{ secrets.QREX_UPLOAD_KEY_ALIAS }}
      QREX_UPLOAD_KEY_PASSWORD: ${{ secrets.QREX_UPLOAD_KEY_PASSWORD }}
      QREX_UPLOAD_CERT_SHA256: ${{ secrets.QREX_UPLOAD_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Provision Android API 36 tools
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-36" ||
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ||
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0"
      - name: Build and verify with the approved existing Play upload certificate
        run: bash tool/sign_android_production.sh
      - name: Generate checksums of signed upload bundle
        run: (cd production && sha256sum QREX-Android-1.0.1.aab > SHA256SUMS-PLAY.txt)
      - name: Upload authenticated bundle for manual Play Console submission
        uses: actions/upload-artifact@v4
        with:
          name: QREX-1.0.1-Google-Play-Upload-Signed-AAB
          path: |
            production/QREX-Android-1.0.1.aab
            production/SHA256SUMS-PLAY.txt
          if-no-files-found: error
          retention-days: 30

# No automatic Google Play submission: the developer must approve policy
# declarations and submit the signed AAB to the correct existing app.
# No GitHub tag/release replacement or destructive legacy cleanup.
