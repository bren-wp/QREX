name: Publish verified native QREX QA preview

on:
  push:
    branches: [fix/qrex-gallery-memory-and-scanner-stability-20261017]
    paths:
      - "platforms/**"
      - "tool/**"
      - "l10n/**"
      - "README.md"
      - "docs/**"
      - "RELEASE_NOTES.md"
      - ".github/workflows/**"

  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: qrex-native-v024-rc-publish
  cancel-in-progress: true

jobs:
  candidate:
    name: Publish native QA candidate after all platform and screenshot checks
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      CI_SHA: ${{ github.sha }}
      QREX_RC_BRANCH: fix/qrex-gallery-memory-and-scanner-stability-20261017
      QREX_RC_TAG: v0.2.4-rc.1
    steps:
      - uses: actions/checkout@v4
      - name: Correct previously misclassified unsigned release candidates
        run: |
          set -euo pipefail
          for tag in v0.2.0-rc.1 v0.2.1-rc.1 v0.2.2-rc.1 v0.2.3-rc.1; do
            id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id)"
            version="${tag#v}"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
              -F prerelease=true -f make_latest=false \
              -f name="QREX ${version} — Native QA preview (not store-signed)" >/dev/null
            test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq .prerelease)" = true
            test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq .name)" = "QREX ${version} — Native QA preview (not store-signed)"
          done
      - name: Check release gate shell syntax
        run: bash -n tool/publish_native_rc.sh
      - name: Release native preview only after green exact-SHA CI
        run: bash tool/publish_native_rc.sh
