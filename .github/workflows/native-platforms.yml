name: Kotlin and Swift Platforms

on:
  pull_request:
    paths:
      - "platforms/**"
      - ".github/workflows/**"
      - ".github/workflows/native-platforms.yml"
      - ".github/workflows/capture-screenshots.yml"
      - "tool/check_native_release.py"
      - "tool/test_native_release.py"
      - "tool/publish_native_rc.sh"
      - ".github/workflows/release-native-preview.yml"
      - "tool/capture_android_screen.sh"
      - "tool/test_capture_workflow.py"
      - "tool/test_android_screen.py"
      - "tool/check_android_screen.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Kotlin Android compile and tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify Android SDK from hosted runner
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -d "$ANDROID_HOME/platforms/android-36" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Check screenshot authenticity gate
        run: python3 -m unittest discover -s tool -p 'test_*.py'
      - name: Check production UI labels
        run: python3 tool/check_public_ui.py
      - name: Verify 23-language translation coverage
        run: |
          python3 tool/generate_localizations.py --check
          python3 tool/check_translation_usage.py
      - name: Compile Kotlin app and execute unit tests
        working-directory: platforms/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: Check native distribution metadata
        run: python3 tool/check_native_release.py
      - name: Validate Android lint and R8 release variants
        working-directory: platforms/android
        run: gradle --no-daemon --stacktrace :app:lintDebug :app:assembleRelease :app:bundleRelease
      - name: Confirm Android package
        run: |
          test -s platforms/android/app/build/outputs/apk/debug/app-debug.apk
          test -s platforms/android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: QREX-Kotlin-Android-debug
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned Android AAB QA candidate (not store ready)
        uses: actions/upload-artifact@v4
        with:
          name: QREX-Kotlin-Android-unsigned-AAB-QA
          path: platforms/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    name: SwiftUI iOS simulator compile
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Verify current App Store SDK requirements
        run: |
          set -euo pipefail
          XCODE_MAJOR="$(xcodebuild -version | awk '/^Xcode / { split($2, v, "."); print v[1] }')"
          SDK_MAJOR="$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)"
          echo "Xcode major: $XCODE_MAJOR, iOS SDK major: $SDK_MAJOR"
          test "$XCODE_MAJOR" -ge 26
          test "$SDK_MAJOR" -ge 26
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate bundled QREX app icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          from tool.prepare_platforms import render_png
          dest = Path("platforms/ios/QREX/Assets.xcassets/AppIcon.appiconset")
          dest.mkdir(parents=True, exist_ok=True)
          render_png(dest / "AppIcon.png", 1024)
          (dest / "Contents.json").write_text(json.dumps({
            "images": [{"filename":"AppIcon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],
            "info": {"author":"xcode","version":1}
          }), encoding="utf-8")
          PY
      - name: Verify native release metadata and signing readiness
        run: python3 tool/check_native_release.py
      - name: Check release metadata regression tests
        run: python3 -m unittest discover -s tool -p 'test_native_release.py'
      - name: Verify localization resource parity
        run: |
          python3 tool/generate_localizations.py --check
          python3 tool/check_translation_usage.py
      - name: Generate Xcode project
        working-directory: platforms/ios
        run: xcodegen generate --spec project.yml
      - name: Compile SwiftUI app for iOS simulator
        working-directory: platforms/ios
        run: |
          xcodebuild -project QREX.xcodeproj -scheme QREX \
            -configuration Release -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Verify iOS binary and privacy manifest
        working-directory: platforms/ios
        run: |
          test -s build/Build/Products/Release-iphonesimulator/QREX.app/QREX
          test -s build/Build/Products/Release-iphonesimulator/QREX.app/PrivacyInfo.xcprivacy
          plutil -lint build/Build/Products/Release-iphonesimulator/QREX.app/PrivacyInfo.xcprivacy
          test -s build/Build/Products/Release-iphonesimulator/QREX.app/en.lproj/Localizable.strings
          test -s build/Build/Products/Release-iphonesimulator/QREX.app/hr.lproj/Localizable.strings
          test -s build/Build/Products/Release-iphonesimulator/QREX.app/de.lproj/Localizable.strings

      - name: Execute Swift XCTest suite on a booted iPhone simulator
        working-directory: platforms/ios
        run: |
          DEVICE=$(python3 - <<'PY'
          import json,subprocess
          all_devices=json.loads(subprocess.check_output([
            "xcrun","simctl","list","devices","available","--json"
          ]))["devices"]
          matches=[d["udid"] for devices in all_devices.values() for d in devices
                   if d.get("isAvailable") and "iPhone" in d.get("name","")]
          if not matches: raise SystemExit("No iPhone simulator available for XCTest")
          print(matches[0])
          PY
          )
          xcodebuild -project QREX.xcodeproj -scheme QREX \
            -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -derivedDataPath build -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES test
      - name: Build unsigned iOS device archive as a signing QA candidate
        working-directory: platforms/ios
        run: |
          xcodebuild -project QREX.xcodeproj -scheme QREX \
            -configuration Release -destination "generic/platform=iOS" \
            -archivePath build/QREX-unsigned.xcarchive -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO archive
          test -s build/QREX-unsigned.xcarchive/Products/Applications/QREX.app/QREX
          plutil -lint build/QREX-unsigned.xcarchive/Products/Applications/QREX.app/PrivacyInfo.xcprivacy
      - name: Upload unsigned iOS device archive (not an IPA)
        uses: actions/upload-artifact@v4
        with:
          name: QREX-iOS-unsigned-archive-QA
          path: platforms/ios/build/QREX-unsigned.xcarchive
          if-no-files-found: error

