name: QREX Android native CI

on:
  pull_request:
    paths:
      - "README.md"
      - "RELEASE_NOTES.md"
      - "docs/**"
      - "assets/**"
      - "platforms/**"
      - ".github/workflows/**"
      - ".github/workflows/native-platforms.yml"
      - ".github/workflows/capture-screenshots.yml"
      - "tool/p03_crash_triage.py"
      - "tool/test_p03_crash_triage.py"
      - "tool/check_native_release.py"
      - "tool/test_native_release.py"
      - "tool/verify_production_gate.sh"
      - "tool/sign_android_production.sh"
      - ".github/workflows/production-release.yml"
      - "tool/capture_android_screen.sh"
      - "tool/test_capture_workflow.py"
      - "tool/test_android_screen.py"
      - "tool/check_android_screen.py"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "RELEASE_NOTES.md"
      - "docs/**"
      - "assets/**"
      - "platforms/**"
      - "tool/**"
      - "l10n/**"
      - ".github/workflows/native-platforms.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Kotlin Android compile and tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify Android SDK from hosted runner
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -d "$ANDROID_HOME/platforms/android-36" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Check screenshot authenticity gate
        run: python3 -m unittest discover -s tool -p 'test_*.py'
      - name: Check production UI labels
        run: python3 tool/check_public_ui.py
      - name: Verify 23-language translation coverage
        run: |
          python3 tool/generate_localizations.py --check
          python3 tool/check_translation_usage.py
      - name: Compile Kotlin app and execute unit tests
        working-directory: platforms/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: Check native distribution metadata
        run: python3 tool/check_native_release.py
      - name: Validate Android lint and R8 release variants
        working-directory: platforms/android
        run: gradle --no-daemon --stacktrace :app:lintDebug :app:assembleRelease :app:bundleRelease
      - name: Audit final merged SDK permissions
        run: python3 tool/check_merged_manifest.py
      - name: Check bundled 64-bit native libraries for 16-KiB ELF alignment
        run: python3 tool/check_16kb_bundle.py
      - name: Confirm Android package
        run: |
          test -s platforms/android/app/build/outputs/apk/debug/app-debug.apk
          test -s platforms/android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: QREX-Kotlin-Android-debug
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned Android AAB QA candidate (not store ready)
        uses: actions/upload-artifact@v4
        with:
          name: QREX-Kotlin-Android-unsigned-AAB-QA
          path: platforms/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
