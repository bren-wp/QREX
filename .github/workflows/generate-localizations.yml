name: Validate QREX localization resources

on:
  pull_request:
    paths:
      - "l10n/**"
      - "platforms/android/app/src/main/res/values*/strings.xml"
      - "platforms/ios/QREX/*.lproj/Localizable.strings"
      - "tool/generate_localizations.py"
      - "tool/check_translation_usage.py"
      - ".github/workflows/generate-localizations.yml"
  push:
    branches: [main]
    paths:
      - "l10n/**"
      - "tool/generate_localizations.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qrex-localization-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify all 23 Android and iOS language catalogs
        run: |
          python3 tool/generate_localizations.py --check
          python3 tool/check_translation_usage.py
