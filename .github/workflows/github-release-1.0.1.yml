name: Publish QREX 1.0.1 GitHub APK + AAB

# A single GitHub distribution, not a Google Play submission. The user
# explicitly requested GitHub 1.0.1 without their production upload key.
# Trigger only after the native Android CI succeeds on a main-branch push.
on:
  workflow_run:
    workflows: ["QREX Android native CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: qrex-github-1-0-0-publish-once
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out the exact tested Android commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Require current main and no previous v1.0.1 release
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "bren-wp/QREX"
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$RELEASE_SHA"
          ! gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.1" >/dev/null 2>&1
      - name: Require all 3 green exact-commit Android checks
        shell: bash
        run: |
          set -euo pipefail
          required=(native-platforms.yml capture-screenshots.yml generate-localizations.yml)
          for attempt in $(seq 1 45); do
            all_passed=true
            for workflow in "${required[@]}"; do
              result="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&head_sha=$RELEASE_SHA&per_page=30" |
                jq -r --arg sha "$RELEASE_SHA" '[.workflow_runs[] |
                  select(.head_sha == $sha and .event == "push")] |
                  sort_by(.id) | last |
                  if . == null then "missing" else (.status + ":" + (.conclusion // "pending")) end')"
              echo "$workflow: $result"
              if [ "$result" = "completed:failure" ] || [ "$result" = "completed:cancelled" ]; then
                echo "A required workflow did not pass, refusing to publish." >&2
                exit 1
              fi
              if [ "$result" != "completed:success" ]; then all_passed=false; fi
            done
            if [ "$all_passed" = true ]; then exit 0; fi
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$RELEASE_SHA"
            echo "Waiting for all required tests (attempt $attempt/45)"
            sleep 20
          done
          echo "Timed out waiting for successful exact-commit checks." >&2
          exit 1
      - name: Set up Java and Android build tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Ensure Android SDK 36
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-36" ||
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ||
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0"
      - name: Build a release-mode APK and AAB without the Play upload key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Android APKs require a cryptographic signature to install.
          # Generate a disposable, one-build certificate; no Play key is needed.
          # This cert is NOT retained: this APK cannot update an installation
          # signed with another certificate, and the AAB is NOT Play-ready.
          keystore="$RUNNER_TEMP/qrex-github-1.0.1.jks"
          trap 'rm -f "$keystore"' EXIT
          password="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -keystore "$keystore" -alias qrex-github \
            -keyalg RSA -keysize 3072 -validity 3650 \
            -storepass "$password" -keypass "$password" \
            -dname "CN=QREX 1.0.1 GitHub, OU=CI Distribution, O=Brendigo, C=HR" >/dev/null
          export QREX_UPLOAD_STORE_FILE="$keystore"
          export QREX_UPLOAD_STORE_PASSWORD="$password"
          export QREX_UPLOAD_KEY_ALIAS="qrex-github"
          export QREX_UPLOAD_KEY_PASSWORD="$password"
          python3 tool/check_native_release.py
          python3 tool/generate_localizations.py --check
          gradle -p platforms/android --no-daemon --stacktrace \
            :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease
          apk="platforms/android/app/build/outputs/apk/release/app-release.apk"
          aab="platforms/android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$apk"
          test -s "$aab"
          # A disposable self-signed GitHub certificate is not in a public
          # PKI trust store. -strict rejects that expected condition (exit 4).
          # Verify JAR signature integrity and then compare both exact certs.
          jarsigner -verify "$aab" > "$RUNNER_TEMP/qrex-aab-verify.txt"
          grep -F 'jar verified.' "$RUNNER_TEMP/qrex-aab-verify.txt" >/dev/null
          rm -f "$RUNNER_TEMP/qrex-aab-verify.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --min-sdk-version 26 "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$apk" >/dev/null
          cert_aab="$(keytool -printcert -jarfile "$aab" |
            sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 |
            tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          cert_apk="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 |
            tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          [[ "$cert_aab" =~ ^[A-F0-9]{64}$ ]]
          test "$cert_aab" = "$cert_apk"
          test "$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" |
            sed -n "s/^package: name='\([^']*\)' versionCode='\([^']*\)' versionName='\([^']*\)'.*/\1 \2 \3/p" |
            head -n 1)" = "com.brendigo.qrex 101 1.0.1"
          mkdir -p production
          cp "$apk" production/QREX-Android-1.0.1.apk
          cp "$aab" production/QREX-Android-1.0.1.aab
          (cd production && sha256sum QREX-Android-1.0.1.apk QREX-Android-1.0.1.aab > SHA256SUMS.txt)
      - name: Publish stable GitHub version v1.0.1
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$RELEASE_SHA"
          ! gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.1" >/dev/null 2>&1
          gh release create v1.0.1 \
            production/QREX-Android-1.0.1.apk \
            production/QREX-Android-1.0.1.aab \
            production/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" \
            --title "QREX 1.0.1 — Android GitHub release" \
            --notes-file docs/releases/v1.0.1.md --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.1" |
            jq -e --arg sha "$RELEASE_SHA" '
              .tag_name == "v1.0.1" and .target_commitish == $sha
              and .draft == false and .prerelease == false
              and ([.assets[].name] | sort) ==
                (["QREX-Android-1.0.1.apk", "QREX-Android-1.0.1.aab", "SHA256SUMS.txt"] | sort)
              and all(.assets[]; .size > 0)
            ' >/dev/null
