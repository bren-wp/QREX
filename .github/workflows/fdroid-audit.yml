name: QREX official F-Droid readiness audit
on:
  pull_request:
    paths:
      - "platforms/**"
      - "tool/**"
      - "distribution/**"
      - ".github/workflows/fdroid-audit.yml"
  push:
    branches: [main]
    paths:
      - "platforms/**"
      - "tool/**"
      - "distribution/**"
      - ".github/workflows/fdroid-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qrex-fdroid-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-dependency-check:
    name: Offline scanner, FLOSS dependency preflight and Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-36" ||
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ||
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0"
      - name: Scan source for proprietary QR runtime and verify Python test suite
        run: |
          set -euo pipefail
          python3 tool/fdroid_readiness.py --strict
          python3 -m unittest discover -s tool -p 'test_*.py'
      - name: Build release APK and run Kotlin unit tests + lint
        shell: bash
        run: |
          set -euo pipefail
          gradle -p platforms/android --no-daemon --stacktrace \
            :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
          test -s platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Audit resolved, transitive release runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          gradle -p platforms/android --no-daemon \
            :app:dependencies --configuration releaseRuntimeClasspath \
            > "$RUNNER_TEMP/qrex-release-runtime-dependencies.txt"
          python3 tool/fdroid_dependency_audit.py \
            "$RUNNER_TEMP/qrex-release-runtime-dependencies.txt"
      - name: F-Droid source signature scan and metadata lint
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/fdroid-tools"
          "$RUNNER_TEMP/fdroid-tools/bin/pip" install --disable-pip-version-check fdroidserver
          export PATH="$RUNNER_TEMP/fdroid-tools/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/fdroid-qrex/metadata" \
            "$RUNNER_TEMP/fdroid-qrex/build" "$RUNNER_TEMP/fdroid-qrex/config"
          cp distribution/official-fdroid/metadata/com.brendigo.qrex.yml.example \
            "$RUNNER_TEMP/fdroid-qrex/metadata/com.brendigo.qrex.yml"
          # fdroid lint validates app categories against the REPOSITORY category
          # config, not a hardcoded list. An isolated temporary repo has no
          # config/categories.yml, so even real F-Droid categories were rejected.
          # Use the authoritative fdroiddata list and fail closed if unavailable.
          curl --fail --location --retry 3 --silent --show-error \
            "https://gitlab.com/fdroid/fdroiddata/-/raw/master/config/categories.yml" \
            --output "$RUNNER_TEMP/fdroid-qrex/config/categories.yml"
          "$RUNNER_TEMP/fdroid-tools/bin/python" - "$RUNNER_TEMP/fdroid-qrex/config/categories.yml" <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys
          import yaml
          category_file = Path(sys.argv[1])
          with category_file.open(encoding="utf-8") as stream:
              categories = yaml.safe_load(stream)
          if not isinstance(categories, dict) or "Connectivity" not in categories:
              raise SystemExit("Official fdroiddata categories are unavailable or invalid")
          # F-Droid lint reads every category entry and copies any referenced
          # icon, not only the icons for this app. Mirror the complete registry.
          icons = {entry.get("icon") for entry in categories.values()
                   if isinstance(entry, dict) and entry.get("icon")}
          for icon in sorted(icons):
              if not isinstance(icon, str) or not re.fullmatch(r"category_[a-z0-9_]+\\.png", icon):
                  raise SystemExit(f"Unsafe or unexpected category icon: {icon}")
              destination = category_file.parent / icon
              subprocess.run([
                  "curl", "--fail", "--location", "--retry", "3",
                  "--silent", "--show-error",
                  f"https://gitlab.com/fdroid/fdroiddata/-/raw/master/config/{icon}",
                  "--output", str(destination),
              ], check=True)
              if destination.read_bytes()[:8] != b"\\x89PNG\\r\\n\\x1a\\n":
                  raise SystemExit(f"Category icon is not a PNG: {icon}")
          print(f"Loaded official fdroiddata categories and {len(icons)} icons")
          PY
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/fdroid-qrex/build/com.brendigo.qrex"
          cd "$RUNNER_TEMP/fdroid-qrex"
          fdroid lint com.brendigo.qrex
          fdroid scanner --exit-code com.brendigo.qrex
          echo "Scanner passed this checkout. Final release/tag and reproducible build still require review."
      - name: Upload unsigned build for QA only
        uses: actions/upload-artifact@v4
        with:
          name: QREX-FDroid-unsigned-test-APK
          path: platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
