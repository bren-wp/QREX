name: QREX protected multi-store release (Play + Brendigo F-Droid)
# For NEW versions only. Existing v1.0.0–v1.0.3 tags and assets are immutable.
# Fails closed if a permanent upload key or Brendigo APK key is missing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New semantic version, e.g. 1.0.4, matching Android Gradle metadata'
        type: string
        required: true
      release_confirm:
        description: 'Enter PUBLISH_QREX_<version> (for example PUBLISH_QREX_1.0.4)'
        type: string
        required: true
      device_qa_confirmed:
        description: 'Physical-device scanning, export, startup and upgrade QA complete'
        required: true
        type: boolean
        default: false
      store_review_confirmed:
        description: 'Checked Play upload SHA-256, versionCode and store declarations'
        required: true
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: qrex-multi-store-release
  cancel-in-progress: false

jobs:
  distribute:
    if: ${{ inputs.device_qa_confirmed && inputs.store_review_confirmed }}
    name: Verified signed distribution and GitHub release
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_CONFIRM: ${{ inputs.release_confirm }}
      QREX_UPLOAD_KEYSTORE_BASE64: ${{ secrets.QREX_UPLOAD_KEYSTORE_BASE64 }}
      QREX_UPLOAD_STORE_PASSWORD: ${{ secrets.QREX_UPLOAD_STORE_PASSWORD }}
      QREX_UPLOAD_KEY_ALIAS: ${{ secrets.QREX_UPLOAD_KEY_ALIAS }}
      QREX_UPLOAD_KEY_PASSWORD: ${{ secrets.QREX_UPLOAD_KEY_PASSWORD }}
      QREX_UPLOAD_CERT_SHA256: ${{ secrets.QREX_UPLOAD_CERT_SHA256 }}
      QREX_FDROID_APK_KEYSTORE_BASE64: ${{ secrets.QREX_FDROID_APK_KEYSTORE_BASE64 }}
      QREX_FDROID_APK_STORE_PASSWORD: ${{ secrets.QREX_FDROID_APK_STORE_PASSWORD }}
      QREX_FDROID_APK_KEY_ALIAS: ${{ secrets.QREX_FDROID_APK_KEY_ALIAS }}
      QREX_FDROID_APK_KEY_PASSWORD: ${{ secrets.QREX_FDROID_APK_KEY_PASSWORD }}
      QREX_FDROID_APK_CERT_SHA256: ${{ secrets.QREX_FDROID_APK_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate new release metadata and exact authorized commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_CONFIRM" = "PUBLISH_QREX_$RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          gradle_file=platforms/android/app/build.gradle.kts
          source_version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' "$gradle_file" | head -1)"
          source_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\).*/\1/p' "$gradle_file" | head -1)"
          test "$source_version" = "$RELEASE_VERSION"
          [[ "$source_code" =~ ^[0-9]+$ ]] && test "$source_code" -ge 104
          echo "RELEASE_CODE=$source_code" >> "$GITHUB_ENV"
          test -s "docs/releases/v$RELEASE_VERSION.md"
          if gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing GitHub release." >&2; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing Git tag." >&2; exit 1
          fi
          # Gate the exact main SHA, never a successful build of some other commit.
          for workflow in native-platforms.yml capture-screenshots.yml generate-localizations.yml; do
            result="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&head_sha=$GITHUB_SHA&per_page=30" |
              jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] |
                select(.head_sha == $sha and .event == "push")] | sort_by(.id) | last |
                if . == null then "missing" else (.status + ":" + (.conclusion // "pending")) end')"
            echo "$workflow : $result"
            test "$result" = "completed:success" || {
              echo "Missing passing exact-SHA CI; release refused." >&2; exit 1;
            }
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android 36 build tools
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-36" ||
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ||
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0"
      - name: Build, sign and verify Play AAB + two separately signed APKs
        shell: bash
        run: bash tool/build_multi_store_release.sh "$RELEASE_VERSION" "$RELEASE_CODE"
      - name: Publish only a complete and verified release
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          test -s "distribution-output/QREX-Android-$RELEASE_VERSION-Google-Play.aab"
          test -s "distribution-output/QREX-Android-$RELEASE_VERSION-Google-Play-QA.apk"
          test -s "distribution-output/QREX-Android-$RELEASE_VERSION-Brendigo-FDroid.apk"
          test -s "distribution-output/QREX-$RELEASE_VERSION-Brendigo-FDroid-starter.zip"
          test -s distribution-output/SHA256SUMS.txt
          (cd distribution-output && sha256sum --check SHA256SUMS.txt)
          if gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists, refusing to modify it." >&2; exit 1
          fi
          gh release create "v$RELEASE_VERSION" distribution-output/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "QREX $RELEASE_VERSION — Android Play + Brendigo APK" \
            --notes-file "docs/releases/v$RELEASE_VERSION.md" --latest
          expected="$(find distribution-output -maxdepth 1 -type f -printf '%f\n' | sort)"
          actual="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$RELEASE_VERSION" |
            jq -r '.assets[].name' | sort)"
          test "$expected" = "$actual"
      - name: Retain verified assets from protected CI
        uses: actions/upload-artifact@v4
        with:
          name: QREX-${{ inputs.version }}-verified-distribution
          path: distribution-output/*
          if-no-files-found: error
          retention-days: 30
