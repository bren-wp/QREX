name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - "tool/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Flutter check and Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and iOS project hosts
        run: flutter create --platforms=android,ios --org com.brendigo --project-name qrex .
      - name: Apply QREX native branding and permissions
        run: python3 tool/prepare_platforms.py
      - name: Verify Android store and privacy configuration
        run: python3 tool/verify_platforms.py android
      - name: Resolve packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --fatal-infos
      - name: Unit tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Confirm APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Build Android App Bundle
        run: flutter build appbundle --release
      - name: Confirm AAB
        run: test -s build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: QREX-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: QREX-Android-AAB-unsigned-for-store
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    name: iOS unsigned compilation
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and iOS project hosts
        run: flutter create --platforms=android,ios --org com.brendigo --project-name qrex .
      - name: Apply QREX native branding and permissions
        run: python3 tool/prepare_platforms.py
      - name: Verify iOS App Store privacy resources
        run: python3 tool/verify_platforms.py ios
      - name: Record Xcode version
        run: xcodebuild -version
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze code
        run: flutter analyze --fatal-infos
      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign
      - name: Confirm iOS app and bundled privacy manifest
        run: |
          test -d build/ios/iphoneos/Runner.app
          test -s build/ios/iphoneos/Runner.app/PrivacyInfo.xcprivacy
          plutil -lint build/ios/iphoneos/Runner.app/PrivacyInfo.xcprivacy
